global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "redpanda"
    static_configs:
      - targets: ["redpanda:9644"]

  # Spark's Prometheus servlet — enabled once we add streaming query
  # metrics in the Silver-layer job (next phase)
  - job_name: "spark"
    static_configs:
      - targets: ["spark:4040"]
